<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No encontrado</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 24px 16px;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: clamp(6rem, 25vw, 12rem);
            margin: 0;
            color: #E50914;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
            letter-spacing: 5px;
        }
        h2 {
            font-size: 2.5rem;
            margin-top: -30px;
            color: #f1f1f1;
        }
        p {
            font-size: 1.2rem;
            color: #888888;
            max-width: 500px;
            margin: 20px 0 40px 0;
            line-height: 1.5;
        }
        .btn-volver {
            padding: 15px 30px;
            background-color: #E50914;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .btn-volver:hover {
            background-color: #b20710;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>404</h1>
    <h2>¡La página fue devorada por un Titán!</h2>
    <p>Parece que te desviaste fuera de los muros. El enlace que buscas no existe</p>
    
    <a href="/" class="btn-volver">Volver a un lugar seguro</a>

</body>
</html>
