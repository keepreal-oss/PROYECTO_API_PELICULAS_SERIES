{% extends 'base.html' %}{% block contenido %}<h2>{{ titulo }}</h2><a class="boton" href="{{ crear_url }}">Crear registro</a><table><tr><th>ID</th><th>Registro</th><th>Acciones</th></tr>{% for registro in object_list %}<tr><td>{{ registro.pk }}</td><td>{{ registro }}</td><td><a href="{% url 'web:'|add:recurso|add:'_detalle' registro.pk %}">Ver detalle</a> · <a href="{% url 'web:'|add:recurso|add:'_editar' registro.pk %}">Editar</a> · <a href="{% url 'web:'|add:recurso|add:'_eliminar' registro.pk %}">Eliminar</a></td></tr>{% empty %}<tr><td colspan="3">Todavía no hay registros.</td></tr>{% endfor %}</table>{% endblock %}
