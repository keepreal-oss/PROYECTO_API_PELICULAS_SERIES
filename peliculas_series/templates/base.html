<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Películas y series{% endblock %}</title>
<style>body{background:#141414;color:#eee;font-family:Arial,sans-serif;margin:0}header,main{padding:24px;max-width:1100px;margin:auto}a{color:#ff777e}nav{display:flex;gap:16px;flex-wrap:wrap}main{background:#202020;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #555}.control{display:block;box-sizing:border-box;width:100%;max-width:650px;padding:10px;margin-top:6px}button,.boton{display:inline-block;background:#b20710;color:white;padding:10px 16px;border:0;border-radius:4px;cursor:pointer;margin:8px 0}.errorlist,.error{color:#ff9393}dt{font-weight:bold;margin-top:16px}dd{margin:6px 0;overflow-wrap:anywhere}form p{margin:18px 0}</style></head>
<body><header><a href="{% url 'bienvenida' %}">Inicio</a><h1>TitanStream</h1><nav><a href="{% url 'web:pais_lista' %}">Pais</a> <a href="{% url 'web:genero_lista' %}">Genero</a> <a href="{% url 'web:director_lista' %}">Director</a> <a href="{% url 'web:actor_lista' %}">Actor</a> <a href="{% url 'web:pelicula_lista' %}">Pelicula</a> <a href="{% url 'web:serie_lista' %}">Serie</a> <a href="{% url 'web:temporada_lista' %}">Temporada</a> <a href="{% url 'web:episodio_lista' %}">Episodio</a> </nav></header><main>{% block contenido %}{% endblock %}</main></body></html>
